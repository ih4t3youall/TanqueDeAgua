<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Conexiones del nodo bomba (esclavo) — Arduino Nano</title>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <!-- Encabezado -->
  <text x="30" y="36" font-size="23" font-weight="700" fill="#2C2C2A">Nodo Bomba (esclavo) — conexiones</text>
  <text x="30" y="58" font-size="13" fill="#5F5E5A">Arduino Nano  ·  nRF24L01 +PA+LNA (antena externa)  ·  AMS1117 5V→3.3V  ·  módulo relé  ·  LED de estado</text>
  <line x1="30" y1="72" x2="970" y2="72" stroke="#E5E3DC" stroke-width="1.5"/>

  <!-- ================= CABLES (debajo de las cajas) ================= -->

  <!-- SPI: 5 cables rectos paralelos Nano -> nRF24 -->
  <line x1="252" y1="152" x2="748" y2="152" stroke="#8FBF3F" stroke-width="2.4"/>
  <line x1="252" y1="180" x2="748" y2="180" stroke="#2F86DD" stroke-width="2.4"/>
  <line x1="252" y1="208" x2="748" y2="208" stroke="#7C6FF0" stroke-width="2.4"/>
  <line x1="252" y1="236" x2="748" y2="236" stroke="#D4537E" stroke-width="2.4"/>
  <line x1="252" y1="264" x2="748" y2="264" stroke="#159E6E" stroke-width="2.4"/>

  <!-- 5V (rojo): Nano 5V -> AMS IN y VCC del relé -->
  <polyline points="252,300 410,300 410,452 760,452" fill="none" stroke="#E24B4A" stroke-width="3"/>
  <line x1="410" y1="312" x2="430" y2="312" stroke="#E24B4A" stroke-width="3"/>
  <circle cx="410" cy="312" r="4" fill="#E24B4A"/>

  <!-- 3.3V (naranja): AMS OUT -> nRF24 VCC -->
  <polyline points="580,326 580,298 748,298" fill="none" stroke="#EF9F27" stroke-width="3"/>

  <!-- GND (negro): Nano GND -> tronco x=340 -> abajo -> sube por x=700 hasta nRF24 GND -->
  <polyline points="252,330 340,330 340,558 700,558 700,326 748,326" fill="none" stroke="#2C2C2A" stroke-width="3"/>
  <line x1="340" y1="344" x2="430" y2="344" stroke="#2C2C2A" stroke-width="3"/>
  <line x1="700" y1="488" x2="760" y2="488" stroke="#2C2C2A" stroke-width="3"/>
  <circle cx="340" cy="344" r="4" fill="#2C2C2A"/>
  <circle cx="700" cy="488" r="4" fill="#2C2C2A"/>
  <circle cx="700" cy="558" r="4" fill="#2C2C2A"/>

  <!-- D3 -> IN del relé (azul) -->
  <polyline points="252,392 360,392 360,416 760,416" fill="none" stroke="#185FA5" stroke-width="2.4"/>

  <!-- D4 -> LED (ámbar): stub, detalle abajo a la izquierda -->
  <line x1="252" y1="420" x2="300" y2="420" stroke="#E08A1E" stroke-width="2.4"/>
  <text x="306" y="424" font-size="10.5" fill="#B5710F">→ LED de estado (ver detalle)</text>

  <!-- ================= CAJAS ================= -->

  <!-- Arduino Nano -->
  <rect x="60" y="110" width="180" height="380" rx="10" fill="#fff" stroke="#888780" stroke-width="2"/>
  <rect x="60" y="110" width="180" height="32" rx="10" fill="#2F7F86"/>
  <text x="150" y="132" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Arduino Nano</text>
  <text x="150" y="478" font-size="10.5" fill="#5F5E5A" text-anchor="middle">alimentación por USB / 5V</text>
  <g font-size="12" fill="#2C2C2A" text-anchor="end">
    <text x="234" y="156">D9 · CE</text>
    <text x="234" y="184">D10 · CSN</text>
    <text x="234" y="212">D13 · SCK</text>
    <text x="234" y="240">D11 · MOSI</text>
    <text x="234" y="268">D12 · MISO</text>
    <text x="234" y="304" font-weight="700" fill="#E24B4A">5V</text>
    <text x="234" y="334" font-weight="700">GND</text>
    <text x="234" y="396">D3 · relé IN</text>
    <text x="234" y="424">D4 · LED</text>
  </g>
  <g stroke-width="2">
    <line x1="240" y1="152" x2="252" y2="152" stroke="#8FBF3F"/>
    <line x1="240" y1="180" x2="252" y2="180" stroke="#2F86DD"/>
    <line x1="240" y1="208" x2="252" y2="208" stroke="#7C6FF0"/>
    <line x1="240" y1="236" x2="252" y2="236" stroke="#D4537E"/>
    <line x1="240" y1="264" x2="252" y2="264" stroke="#159E6E"/>
    <line x1="240" y1="300" x2="252" y2="300" stroke="#E24B4A" stroke-width="3"/>
    <line x1="240" y1="330" x2="252" y2="330" stroke="#2C2C2A" stroke-width="3"/>
    <line x1="240" y1="392" x2="252" y2="392" stroke="#185FA5"/>
    <line x1="240" y1="420" x2="252" y2="420" stroke="#E08A1E"/>
  </g>

  <!-- nRF24L01 -->
  <rect x="760" y="110" width="180" height="220" rx="10" fill="#fff" stroke="#888780" stroke-width="2"/>
  <rect x="760" y="110" width="180" height="30" rx="10" fill="#7C6FF0"/>
  <text x="850" y="131" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">nRF24L01 +PA+LNA</text>
  <g font-size="12" fill="#2C2C2A" text-anchor="start">
    <text x="772" y="156">CE</text>
    <text x="772" y="184">CSN</text>
    <text x="772" y="212">SCK</text>
    <text x="772" y="240">MOSI</text>
    <text x="772" y="268">MISO</text>
    <text x="772" y="302" font-weight="700" fill="#BA7517">VCC 3.3V</text>
    <text x="772" y="330" font-weight="700">GND</text>
    <text x="772" y="360" font-size="10.5" fill="#888780">IRQ — no se conecta</text>
  </g>
  <g stroke-width="2">
    <line x1="748" y1="152" x2="760" y2="152" stroke="#8FBF3F"/>
    <line x1="748" y1="180" x2="760" y2="180" stroke="#2F86DD"/>
    <line x1="748" y1="208" x2="760" y2="208" stroke="#7C6FF0"/>
    <line x1="748" y1="236" x2="760" y2="236" stroke="#D4537E"/>
    <line x1="748" y1="264" x2="760" y2="264" stroke="#159E6E"/>
    <line x1="748" y1="298" x2="760" y2="298" stroke="#EF9F27" stroke-width="3"/>
    <line x1="748" y1="326" x2="760" y2="326" stroke="#2C2C2A" stroke-width="3"/>
  </g>

  <!-- AMS1117 -->
  <rect x="430" y="290" width="150" height="72" rx="9" fill="#fff" stroke="#BA7517" stroke-width="2"/>
  <text x="505" y="312" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">AMS1117</text>
  <text x="505" y="328" font-size="10.5" fill="#5F5E5A" text-anchor="middle">regulador 5V → 3.3V</text>
  <text x="436" y="316" font-size="10" font-weight="700" fill="#E24B4A" text-anchor="start">IN</text>
  <text x="436" y="348" font-size="10" font-weight="700" fill="#2C2C2A" text-anchor="start">GND</text>
  <text x="574" y="322" font-size="10" font-weight="700" fill="#BA7517" text-anchor="end">OUT</text>
  <line x1="418" y1="312" x2="430" y2="312" stroke="#E24B4A" stroke-width="3"/>
  <line x1="418" y1="344" x2="430" y2="344" stroke="#2C2C2A" stroke-width="3"/>
  <line x1="580" y1="326" x2="592" y2="326" stroke="#EF9F27" stroke-width="3"/>

  <!-- Módulo relé -->
  <rect x="760" y="380" width="180" height="150" rx="10" fill="#fff" stroke="#888780" stroke-width="2"/>
  <rect x="760" y="380" width="180" height="30" rx="10" fill="#4A7A9E"/>
  <text x="850" y="401" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Módulo relé (1 canal)</text>
  <g font-size="12" fill="#2C2C2A" text-anchor="start">
    <text x="772" y="420" font-weight="700" fill="#185FA5">IN</text>
    <text x="772" y="456" font-weight="700" fill="#E24B4A">VCC 5V</text>
    <text x="772" y="492" font-weight="700">GND</text>
  </g>
  <text x="850" y="518" font-size="9.5" fill="#888780" text-anchor="middle">salida: COM · NO · NC → a la bomba</text>
  <g stroke-width="2">
    <line x1="748" y1="416" x2="760" y2="416" stroke="#185FA5"/>
    <line x1="748" y1="452" x2="760" y2="452" stroke="#E24B4A" stroke-width="3"/>
    <line x1="748" y1="488" x2="760" y2="488" stroke="#2C2C2A" stroke-width="3"/>
  </g>

  <!-- ================= DETALLE DEL LED ================= -->
  <rect x="60" y="512" width="360" height="180" rx="10" fill="#FCFBF7" stroke="#BA7517" stroke-width="1.6"/>
  <text x="78" y="536" font-size="13" font-weight="700" fill="#854F0B">LED de estado (opcional)</text>
  <text x="78" y="556" font-size="11" fill="#5F5E5A">Encendido = bomba ON.  Apagado = bomba cortada.</text>

  <!-- esquema del LED: D4 -> 220Ω -> anodo -> catodo -> GND -->
  <text x="104" y="606" font-size="11" font-weight="700" fill="#E08A1E" text-anchor="end">D4</text>
  <line x1="108" y1="602" x2="150" y2="602" stroke="#E08A1E" stroke-width="2.2"/>
  <rect x="150" y="594" width="52" height="16" rx="3" fill="#fff" stroke="#854F0B" stroke-width="1.4"/>
  <text x="176" y="606" font-size="9.5" font-weight="700" fill="#854F0B" text-anchor="middle">220Ω</text>
  <line x1="202" y1="602" x2="236" y2="602" stroke="#E08A1E" stroke-width="2.2"/>
  <!-- LED (triángulo + barra de cátodo) -->
  <polygon points="238,592 238,612 258,602" fill="#F2C94C" stroke="#B5710F" stroke-width="1.4"/>
  <line x1="258" y1="590" x2="258" y2="614" stroke="#B5710F" stroke-width="2.4"/>
  <line x1="258" y1="602" x2="292" y2="602" stroke="#2C2C2A" stroke-width="2.2"/>
  <line x1="292" y1="602" x2="292" y2="640" stroke="#2C2C2A" stroke-width="2.2"/>
  <text x="292" y="656" font-size="10" font-weight="700" fill="#2C2C2A" text-anchor="middle">GND</text>
  <text x="150" y="582" font-size="9" fill="#854F0B" text-anchor="middle">ánodo (+)</text>
  <text x="270" y="582" font-size="9" fill="#854F0B" text-anchor="start">cátodo (–)</text>
  <g font-size="10.5" fill="#854F0B">
    <text x="310" y="606">• D4 → 220Ω → ánodo</text>
    <text x="310" y="624">• pata corta → GND</text>
  </g>

  <!-- ================= REFERENCIAS / NOTAS ================= -->
  <rect x="440" y="560" width="530" height="132" rx="10" fill="#FBFBF9" stroke="#D9D7CE" stroke-width="1.6"/>
  <text x="458" y="584" font-size="12.5" font-weight="700" fill="#2C2C2A">Referencia de cables</text>
  <g font-size="11" fill="#5F5E5A">
    <line x1="458" y1="602" x2="482" y2="602" stroke="#8FBF3F" stroke-width="3"/><text x="488" y="606">CE (D9→CE)</text>
    <line x1="600" y1="602" x2="624" y2="602" stroke="#2F86DD" stroke-width="3"/><text x="630" y="606">CSN (D10→CSN)</text>
    <line x1="458" y1="622" x2="482" y2="622" stroke="#7C6FF0" stroke-width="3"/><text x="488" y="626">SCK (D13→SCK)</text>
    <line x1="600" y1="622" x2="624" y2="622" stroke="#D4537E" stroke-width="3"/><text x="630" y="626">MOSI (D11→MOSI)</text>
    <line x1="458" y1="642" x2="482" y2="642" stroke="#159E6E" stroke-width="3"/><text x="488" y="646">MISO (D12→MISO)</text>
    <line x1="600" y1="642" x2="624" y2="642" stroke="#185FA5" stroke-width="3"/><text x="630" y="646">D3 → IN del relé</text>
    <line x1="458" y1="662" x2="482" y2="662" stroke="#E24B4A" stroke-width="3"/><text x="488" y="666">5V</text>
    <line x1="540" y1="662" x2="564" y2="662" stroke="#EF9F27" stroke-width="3"/><text x="570" y="666">3.3V</text>
    <line x1="640" y1="662" x2="664" y2="662" stroke="#2C2C2A" stroke-width="3"/><text x="670" y="666">GND (común)</text>
    <line x1="770" y1="662" x2="794" y2="662" stroke="#E08A1E" stroke-width="3"/><text x="800" y="666">D4 → LED</text>
  </g>
  <text x="458" y="684" font-size="10.5" fill="#BA7517">Recomendado: capacitor 10–47µF entre VCC(3.3V) y GND del nRF24, pegado al módulo (esclavo).</text>

</svg>
