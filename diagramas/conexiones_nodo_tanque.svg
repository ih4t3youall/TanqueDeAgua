<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Conexiones del nodo tanque (maestro) — ESP32</title>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <!-- Encabezado -->
  <text x="30" y="36" font-size="23" font-weight="700" fill="#2C2C2A">Nodo Tanque (maestro) — conexiones</text>
  <text x="30" y="58" font-size="13" fill="#5F5E5A">ESP32  ·  nRF24L01 (alimentado por AMS1117 5V→3.3V)  ·  sensor JSN-SR04T (ECHO con divisor 100Ω / 180Ω)</text>
  <line x1="30" y1="72" x2="970" y2="72" stroke="#E5E3DC" stroke-width="1.5"/>

  <!-- ================= CABLES (se dibujan primero, debajo de las cajas) ================= -->

  <!-- SPI: 5 cables rectos paralelos ESP32 -> nRF24 -->
  <line x1="252" y1="152" x2="748" y2="152" stroke="#8FBF3F" stroke-width="2.4"/>
  <line x1="252" y1="180" x2="748" y2="180" stroke="#2F86DD" stroke-width="2.4"/>
  <line x1="252" y1="208" x2="748" y2="208" stroke="#7C6FF0" stroke-width="2.4"/>
  <line x1="252" y1="236" x2="748" y2="236" stroke="#D4537E" stroke-width="2.4"/>
  <line x1="252" y1="264" x2="748" y2="264" stroke="#159E6E" stroke-width="2.4"/>

  <!-- 5V (rojo): ESP32 5V -> baja por x=410 -> AMS IN y JSN VCC -->
  <polyline points="252,300 410,300 410,416 760,416" fill="none" stroke="#E24B4A" stroke-width="3"/>
  <line x1="410" y1="312" x2="430" y2="312" stroke="#E24B4A" stroke-width="3"/>
  <circle cx="410" cy="312" r="4" fill="#E24B4A"/>

  <!-- 3.3V (naranja): AMS OUT -> nRF24 VCC -->
  <polyline points="580,326 580,298 748,298" fill="none" stroke="#EF9F27" stroke-width="3"/>

  <!-- GND (negro): ESP32 GND -> tronco x=340 -> abajo -> sube por x=700 hasta nRF24 GND -->
  <polyline points="252,330 340,330 340,558 700,558 700,326 748,326" fill="none" stroke="#2C2C2A" stroke-width="3"/>
  <line x1="340" y1="344" x2="430" y2="344" stroke="#2C2C2A" stroke-width="3"/>
  <line x1="700" y1="524" x2="760" y2="524" stroke="#2C2C2A" stroke-width="3"/>
  <circle cx="340" cy="330" r="4" fill="#2C2C2A"/>
  <circle cx="340" cy="344" r="4" fill="#2C2C2A"/>
  <circle cx="700" cy="524" r="4" fill="#2C2C2A"/>
  <circle cx="700" cy="558" r="4" fill="#2C2C2A"/>

  <!-- TRIG (azul): ESP32 G26 -> JSN TRIG -->
  <polyline points="252,400 360,400 360,452 760,452" fill="none" stroke="#185FA5" stroke-width="2.4"/>

  <!-- ECHO (verde) con divisor: JSN ECHO -> R1 -> nodo -> ESP32 G25 ; nodo -> R2 -> GND -->
  <line x1="760" y1="488" x2="715" y2="488" stroke="#4E8F1F" stroke-width="2.4"/>
  <rect x="655" y="480" width="60" height="16" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
  <text x="685" y="492" font-size="9.5" font-weight="700" fill="#854F0B" text-anchor="middle">R1 100Ω</text>
  <line x1="655" y1="488" x2="620" y2="488" stroke="#4E8F1F" stroke-width="2.4"/>
  <polyline points="620,488 620,428 252,428" fill="none" stroke="#4E8F1F" stroke-width="2.4"/>
  <line x1="620" y1="488" x2="620" y2="512" stroke="#4E8F1F" stroke-width="2.4"/>
  <rect x="606" y="512" width="28" height="34" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
  <text x="620" y="533" font-size="8.5" font-weight="700" fill="#854F0B" text-anchor="middle">R2</text>
  <text x="620" y="543" font-size="8.5" font-weight="700" fill="#854F0B" text-anchor="middle">180Ω</text>
  <line x1="620" y1="546" x2="620" y2="558" stroke="#2C2C2A" stroke-width="3"/>
  <circle cx="620" cy="488" r="4" fill="#4E8F1F"/>
  <circle cx="620" cy="558" r="4" fill="#2C2C2A"/>

  <!-- ================= CAJAS ================= -->

  <!-- ESP32 -->
  <rect x="60" y="110" width="180" height="380" rx="10" fill="#fff" stroke="#888780" stroke-width="2"/>
  <rect x="60" y="110" width="180" height="32" rx="10" fill="#D4537E"/>
  <text x="150" y="132" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">ESP32 (maestro)</text>
  <text x="150" y="478" font-size="10.5" fill="#5F5E5A" text-anchor="middle">alimentación por USB</text>
  <g font-size="12" fill="#2C2C2A" text-anchor="end">
    <text x="234" y="156">G4 · CE</text>
    <text x="234" y="184">G5 · CSN</text>
    <text x="234" y="212">G18 · SCK</text>
    <text x="234" y="240">G22 · MOSI</text>
    <text x="234" y="268">G19 · MISO</text>
    <text x="234" y="304" font-weight="700" fill="#E24B4A">5V (VIN)</text>
    <text x="234" y="334" font-weight="700">GND</text>
    <text x="234" y="404">G26 · TRIG</text>
    <text x="234" y="432">G25 · ECHO</text>
  </g>
  <g stroke-width="2">
    <line x1="240" y1="152" x2="252" y2="152" stroke="#8FBF3F"/>
    <line x1="240" y1="180" x2="252" y2="180" stroke="#2F86DD"/>
    <line x1="240" y1="208" x2="252" y2="208" stroke="#7C6FF0"/>
    <line x1="240" y1="236" x2="252" y2="236" stroke="#D4537E"/>
    <line x1="240" y1="264" x2="252" y2="264" stroke="#159E6E"/>
    <line x1="240" y1="300" x2="252" y2="300" stroke="#E24B4A" stroke-width="3"/>
    <line x1="240" y1="330" x2="252" y2="330" stroke="#2C2C2A" stroke-width="3"/>
    <line x1="240" y1="400" x2="252" y2="400" stroke="#185FA5"/>
    <line x1="240" y1="428" x2="252" y2="428" stroke="#4E8F1F"/>
  </g>

  <!-- nRF24L01 -->
  <rect x="760" y="110" width="180" height="220" rx="10" fill="#fff" stroke="#888780" stroke-width="2"/>
  <rect x="760" y="110" width="180" height="30" rx="10" fill="#7C6FF0"/>
  <text x="850" y="131" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">nRF24L01 (radio)</text>
  <g font-size="12" fill="#2C2C2A" text-anchor="start">
    <text x="772" y="156">CE</text>
    <text x="772" y="184">CSN</text>
    <text x="772" y="212">SCK</text>
    <text x="772" y="240">MOSI</text>
    <text x="772" y="268">MISO</text>
    <text x="772" y="302" font-weight="700" fill="#BA7517">VCC 3.3V</text>
    <text x="772" y="330" font-weight="700">GND</text>
    <text x="772" y="360" font-size="10.5" fill="#888780">IRQ — no se conecta</text>
  </g>
  <g stroke-width="2">
    <line x1="748" y1="152" x2="760" y2="152" stroke="#8FBF3F"/>
    <line x1="748" y1="180" x2="760" y2="180" stroke="#2F86DD"/>
    <line x1="748" y1="208" x2="760" y2="208" stroke="#7C6FF0"/>
    <line x1="748" y1="236" x2="760" y2="236" stroke="#D4537E"/>
    <line x1="748" y1="264" x2="760" y2="264" stroke="#159E6E"/>
    <line x1="748" y1="298" x2="760" y2="298" stroke="#EF9F27" stroke-width="3"/>
    <line x1="748" y1="326" x2="760" y2="326" stroke="#2C2C2A" stroke-width="3"/>
  </g>

  <!-- AMS1117 -->
  <rect x="430" y="290" width="150" height="72" rx="9" fill="#fff" stroke="#BA7517" stroke-width="2"/>
  <text x="505" y="312" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">AMS1117</text>
  <text x="505" y="328" font-size="10.5" fill="#5F5E5A" text-anchor="middle">regulador 5V → 3.3V</text>
  <text x="436" y="316" font-size="10" font-weight="700" fill="#E24B4A" text-anchor="start">IN</text>
  <text x="436" y="348" font-size="10" font-weight="700" fill="#2C2C2A" text-anchor="start">GND</text>
  <text x="574" y="322" font-size="10" font-weight="700" fill="#BA7517" text-anchor="end">OUT</text>
  <line x1="418" y1="312" x2="430" y2="312" stroke="#E24B4A" stroke-width="3"/>
  <line x1="418" y1="344" x2="430" y2="344" stroke="#2C2C2A" stroke-width="3"/>
  <line x1="580" y1="326" x2="592" y2="326" stroke="#EF9F27" stroke-width="3"/>

  <!-- JSN-SR04T -->
  <rect x="760" y="380" width="180" height="150" rx="10" fill="#fff" stroke="#888780" stroke-width="2"/>
  <rect x="760" y="380" width="180" height="30" rx="10" fill="#159E6E"/>
  <text x="850" y="401" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">JSN-SR04T (5V)</text>
  <g font-size="12" fill="#2C2C2A" text-anchor="start">
    <text x="772" y="420" font-weight="700" fill="#E24B4A">VCC 5V</text>
    <text x="772" y="456">TRIG</text>
    <text x="772" y="492">ECHO <tspan fill="#854F0B" font-size="10">(sale a 5V)</tspan></text>
    <text x="772" y="528" font-weight="700">GND</text>
  </g>
  <g stroke-width="2">
    <line x1="748" y1="416" x2="760" y2="416" stroke="#E24B4A" stroke-width="3"/>
    <line x1="748" y1="452" x2="760" y2="452" stroke="#185FA5"/>
    <line x1="748" y1="488" x2="760" y2="488" stroke="#4E8F1F"/>
    <line x1="748" y1="524" x2="760" y2="524" stroke="#2C2C2A" stroke-width="3"/>
  </g>

  <!-- ================= DETALLE DEL DIVISOR ================= -->
  <rect x="60" y="512" width="360" height="180" rx="10" fill="#FCFBF7" stroke="#BA7517" stroke-width="1.6"/>
  <text x="78" y="536" font-size="13" font-weight="700" fill="#854F0B">Divisor del ECHO (5V → ~3.2V)</text>
  <text x="78" y="556" font-size="11" fill="#5F5E5A">El ECHO del sensor sale a 5V y el ESP32 admite 3.3V.</text>

  <!-- esquema del divisor -->
  <text x="96" y="602" font-size="11" font-weight="700" fill="#4E8F1F" text-anchor="end">ECHO</text>
  <line x1="100" y1="598" x2="140" y2="598" stroke="#4E8F1F" stroke-width="2.2"/>
  <rect x="140" y="590" width="52" height="16" rx="3" fill="#fff" stroke="#854F0B" stroke-width="1.4"/>
  <text x="166" y="602" font-size="9.5" font-weight="700" fill="#854F0B" text-anchor="middle">100Ω</text>
  <line x1="192" y1="598" x2="240" y2="598" stroke="#4E8F1F" stroke-width="2.2"/>
  <circle cx="240" cy="598" r="4" fill="#4E8F1F"/>
  <text x="240" y="586" font-size="10" font-weight="700" fill="#185FA5" text-anchor="middle">→ a G25</text>
  <line x1="240" y1="598" x2="240" y2="628" stroke="#4E8F1F" stroke-width="2.2"/>
  <rect x="226" y="628" width="28" height="34" rx="3" fill="#fff" stroke="#854F0B" stroke-width="1.4"/>
  <text x="240" y="649" font-size="9" font-weight="700" fill="#854F0B" text-anchor="middle">180Ω</text>
  <line x1="240" y1="662" x2="240" y2="678" stroke="#2C2C2A" stroke-width="2.4"/>
  <text x="240" y="690" font-size="10" font-weight="700" fill="#2C2C2A" text-anchor="middle">GND</text>
  <g font-size="10.5" fill="#854F0B">
    <text x="290" y="596">• 100Ω: del ECHO al nodo</text>
    <text x="290" y="614">• 180Ω: del nodo a GND</text>
    <text x="290" y="632">• El nodo (medio) va a G25</text>
    <text x="290" y="654" font-weight="700">Resultado ≈ 3.2 V ✓</text>
  </g>

  <!-- ================= REFERENCIAS / NOTAS ================= -->
  <rect x="440" y="560" width="530" height="132" rx="10" fill="#FBFBF9" stroke="#D9D7CE" stroke-width="1.6"/>
  <text x="458" y="584" font-size="12.5" font-weight="700" fill="#2C2C2A">Referencia de cables</text>
  <g font-size="11" fill="#5F5E5A">
    <line x1="458" y1="602" x2="482" y2="602" stroke="#8FBF3F" stroke-width="3"/><text x="488" y="606">CE (G4→CE)</text>
    <line x1="600" y1="602" x2="624" y2="602" stroke="#2F86DD" stroke-width="3"/><text x="630" y="606">CSN (G5→CSN)</text>
    <line x1="458" y1="622" x2="482" y2="622" stroke="#7C6FF0" stroke-width="3"/><text x="488" y="626">SCK (G18→SCK)</text>
    <line x1="600" y1="622" x2="624" y2="622" stroke="#D4537E" stroke-width="3"/><text x="630" y="626">MOSI (G22→MOSI)</text>
    <line x1="458" y1="642" x2="482" y2="642" stroke="#159E6E" stroke-width="3"/><text x="488" y="646">MISO (G19→MISO)</text>
    <line x1="600" y1="642" x2="624" y2="642" stroke="#185FA5" stroke-width="3"/><text x="630" y="646">TRIG (G26→TRIG)</text>
    <line x1="458" y1="662" x2="482" y2="662" stroke="#E24B4A" stroke-width="3"/><text x="488" y="666">5V</text>
    <line x1="540" y1="662" x2="564" y2="662" stroke="#EF9F27" stroke-width="3"/><text x="570" y="666">3.3V</text>
    <line x1="640" y1="662" x2="664" y2="662" stroke="#2C2C2A" stroke-width="3"/><text x="670" y="666">GND (común)</text>
    <line x1="770" y1="662" x2="794" y2="662" stroke="#4E8F1F" stroke-width="3"/><text x="800" y="666">ECHO (divisor)</text>
  </g>
  <text x="458" y="684" font-size="10.5" fill="#BA7517">Recomendado: capacitor 10–47µF entre VCC(3.3V) y GND del nRF24, pegado al módulo.</text>

</svg>
